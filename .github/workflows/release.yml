# Builds the signed floor-app APKs and attaches them to a GitHub Release.
# A `v*` tag builds staging; a manual run picks the flavor (prod only once
# AppConfig.hostedSupabaseHosts lists the production host — until then the
# app refuses to start). Secrets live in the GitHub Environment of the same
# environment (`staging` / `production`), same names in each:
#   DART_DEFINES               full contents of dart_define.<flavor>.json (publishable key only)
#   ANDROID_KEYSTORE_BASE64    base64 of the release .jks (docs/RELEASE.md §4)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.0.0)
        required: true
      flavor:
        description: Flavor
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ inputs.flavor || 'staging' }}

jobs:
  android:
    runs-on: ubuntu-latest
    environment: ${{ (inputs.flavor || 'staging') == 'prod' && 'production' || 'staging' }}
    env:
      FLAVOR: ${{ inputs.flavor || 'staging' }}
      TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

      - name: Write define file and signing config (never committed)
        env:
          DART_DEFINES: ${{ secrets.DART_DEFINES }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in DART_DEFINES KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is missing in this environment"; exit 1; }
          done
          printf '%s' "$DART_DEFINES" > "dart_define.$FLAVOR.json"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Gradle refuses a flavor/AO_ENVIRONMENT mismatch, a non-cloud build or a
      # missing key; run_number keeps the version code rising across releases.
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi --flavor "$FLAVOR" \
            --dart-define-from-file="dart_define.$FLAVOR.json" \
            --build-name="${TAG#v}" --build-number="${{ github.run_number }}"

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-$FLAVOR-*-release.apk; do mv "$f" "arena-ops-$TAG-${f#app-}"; done
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --prerelease="${{ env.FLAVOR != 'prod' }}"
          gh release upload "$TAG" arena-ops-*.apk --clobber

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/release.jks" "dart_define.$FLAVOR.json"
